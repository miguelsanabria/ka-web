services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./data/videos:/data/videos:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      OUT_DIR: /app/out
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 8

  # Snapshot consistente de la DB. Alimenta al servicio `backup` de abajo.
  # Se activa con el mismo perfil: docker compose --profile backup up -d
  db-snapshot:
    image: python:3-alpine
    restart: unless-stopped
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["python /scripts/db-snapshot.py"]
    environment:
      KA_DB: /data/rsvp.sqlite
      SNAPSHOT_DIR: /snapshot
      SNAPSHOT_INTERVAL: "3600"
    volumes:
      # rw a proposito: una base en WAL necesita escribir/acceder su -shm.
      # El script solo lee del origen.
      - ./data:/data
      - ./.snapshot:/snapshot
      - ./server/scripts:/scripts:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Respaldo a Backblaze B2. Se activa con: docker compose --profile backup up -d
  backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # 1) DB: se sube el snapshot consistente, no el archivo crudo.
          #    Si aun no hay snapshot, se conserva la copia previa en B2.
          if [ -f /snapshot/rsvp.sqlite ]; then
            rclone copyto /snapshot/rsvp.sqlite :b2:K-A-Backup/boda/rsvp.sqlite \
              --b2-account=$${B2_APPLICATION_KEY_ID} \
              --b2-key=$${B2_APPLICATION_KEY} \
              --verbose=0 \
              || echo "WARN: no se pudo subir el snapshot de la DB"
          else
            echo "WARN: sin snapshot todavia; se conserva la copia previa de la DB"
          fi
          # 2) Resto de datos (videos). SQLite queda excluido a propósito: el
          #    snapshot del paso 1 es la copia buena y `sync` podría pisarla.
          if rclone sync /data :b2:K-A-Backup/boda \
            --b2-account=$${B2_APPLICATION_KEY_ID} \
            --b2-key=$${B2_APPLICATION_KEY} \
            --exclude='inbox/**' \
            --exclude='rsvp.sqlite' \
            --exclude='rsvp.sqlite-shm' \
            --exclude='rsvp.sqlite-wal' \
            --verbose=0
          then
            echo "backup ok $$(date)"
          else
            echo "WARN: fallo el sync de datos $$(date)"
          fi
          sleep 21600
        done
    environment:
      B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
    volumes:
      - ./data:/data:ro
      - ./.snapshot:/snapshot:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  internal:
    driver: bridge