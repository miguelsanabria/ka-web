# Cabeceras de seguridad, en un solo sitio.
#
# Por qué un include y no escribirlas en cada location: `add_header` NO se
# hereda cuando el bloque hijo define sus propios add_header (p. ej. para el
# Cache-Control). Con las cabeceras duplicadas en cada location era facilísimo
# olvidar una, y `/admin` acabó sirviéndose sin ninguna.
#
# Este archivo NO debe ir en conf.d/: allí nginx lo incluiría dentro de http{}
# y un add_header a ese nivel es un error de configuración.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# CSP por fases. Solo directivas que no rompen el sitio: sin default-src ni
# script-src porque Next.js exportado mete scripts y estilos en línea, y
# bloquearlos exigiría nonces o hashes. Cuando se quiera cerrar del todo:
#   default-src 'self'; img-src 'self' data:; media-src 'self';
#   script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;