server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Cabeceras de seguridad a nivel de server: así se aplican a TODAS las
    # respuestas, incluidas las páginas del front (/rsvp, /grabar, /admin).
    # Antes vivían dentro de `location = /index.html`, y como `add_header` no se
    # hereda cuando el hijo define sus propios add_header, el resto de páginas
    # se servían sin ninguna cabecera.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Forzar HTTPS. El dominio va fijo a propósito: con $host un Host manipulado
    # convertía esto en un redirect abierto.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://karen-y-aldo.com$request_uri;
    }

    # Páginas de error personalizadas
    error_page 403 /403.html;
    error_page 404 /404.html;

    location = /403.html {
        root /usr/share/nginx/html;
    }

    location = /404.html {
        root /usr/share/nginx/html;
    }

    # API y webhook → api:3000
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /webhook/whatsapp {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /webhook/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Videos (transcode) servidos por Nginx con byte-range
    # Usar ^~ para que esta ruta tenga prioridad sobre la regla regex de recursos estáticos
    location ^~ /media/videos/ {
        alias /data/videos/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        types { video/mp4 mp4; }
    }

    # Assets con hash (Next.js) → caché inmutable 1 año
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Imágenes, audio y video optimizados → caché larga 1 año
    location ~* \.(avif|webp|png|jpe?g|svg|mp4|m4a|mp3|webm|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Seguridad básica en el HTML
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Rutas que los escáneres de internet prueban por costumbre. El fallback SPA
    # las respondía con 200 + la home, lo que confirma que la ruta existe y
    # llena el log de ruido. Se colocan después de la regla de estáticos para
    # no interceptar las extensiones que sí sirven.
    location ~* \.(php|asp|aspx|jsp|cgi|pl|py|rb|sh|htaccess)$ {
        return 404;
    }
    location ~* ^/(\.env|\.git|\.svn|\.aws|wp-admin|wp-login\.php|xmlrpc\.php) {
        return 404;
    }

    # SPA: rutas de front → index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}